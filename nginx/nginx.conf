# Fin SQL Agent — nginx 反向代理配置（HTTP + HTTPS + webroot 验证）
# 域名：
#   agent.yahui.org.cn  → Text2SQL Agent
#   rag.yahui.org.cn    → RAG 知识库（待部署）

# ============================================================
# HTTP（80）：webroot 验证 + 跳转 HTTPS
# ============================================================
server {
    listen 80;
    server_name agent.yahui.org.cn rag.yahui.org.cn;

    # certbot webroot 验证目录（证书申请时用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS（443）：Text2SQL Agent
# ============================================================
server {
    listen 443 ssl;
    server_name agent.yahui.org.cn;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Agent 查询可能耗时 30-60 秒，超时设长
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        # 通过 docker 内部网络访问 agent 容器（用容器名，不用 IP）
        proxy_pass http://agent:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ============================================================
# HTTPS（443）：RAG 知识库（待部署，先放占位页）
# ============================================================
server {
    listen 443 ssl;
    server_name rag.yahui.org.cn;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        # 未来部署知识库后，改为：
        #   proxy_pass http://knowledge:8000;
        default_type text/plain;
        return 200 "RAG 知识库即将上线";
    }
}