# Fin SQL Agent — 纯后端编排（nginx 已移出全局网关，agent 通过 app-public-net 接入）
#
# 用法:
#   docker compose up -d          # 启动
#   docker compose down           # 停止
#   docker compose logs -f agent  # 看 agent 日志

services:
  agent:
    build: .
    container_name: fin-sql-agent
    # 不映射宿主机端口（agent 只通过 app-public-net 被全局网关访问）
    expose:
      - "8765"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DB_PATH=/app/data/financial.db
      # auth.db 也放挂载的 data 目录下，token 持久化，重启不丢
      - AUTH_DB_PATH=/app/data/auth.db
      - TZ=Asia/Shanghai
    volumes:
      # 挂载 data 目录：financial.db + auth.db 持久化，容器重启数据不丢
      - ./data:/app/data
      # 挂载 logs 目录：审计日志直接落地到宿主机 ./logs/，容器重启/重建也不丢
      - ./logs:/app/logs
    restart: unless-stopped
    # 内存限制（2核2G 机器上各容器都要限，防止 OOM）
    mem_limit: 512m
    networks:
      - public

networks:
  public:
    external: true
    name: app-public-net